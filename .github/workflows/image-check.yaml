---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Image Check"

# Runs on every branch push so Renovate sees the result before branch automerge
on:
  pull_request:
    branches: ["main"]
  push:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arr-images:
    name: Arr images exist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check image tags
        run: .github/scripts/check-arr-images.sh
