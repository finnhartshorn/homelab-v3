---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matter-server
  namespace: home-assistant
spec:
  interval: 30m
  chart:
    spec:
      chart: home-assistant-matter-server
      version: 5.1.1
      sourceRef:
        kind: HelmRepository
        name: derwitt-dev
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Pinned to node3: the chart runs on the host network, and commissioning
    # Thread devices needs an IPv6 route to the Thread prefix. node3 hosts the
    # OTBR (wpan0), so it has that route directly. Other nodes lack the RA
    # route-info sysctls and fail with ENETUNREACH.
    nodeSelector:
      kubernetes.io/hostname: node3
    persistence:
      size: 2Gi
    resources:
      requests:
        cpu: 15m
        memory: 192Mi
      limits:
        memory: 384Mi
