---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: swiparr
  namespace: swiparr
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  # See https://github.com/bjw-s/helm-charts/blob/main/charts/library/common/values.yaml
  values:
    controllers:
      main:
        containers:
          app:
            image:
              repository: ghcr.io/m3sserstudi0s/swiparr
              tag: 1.6.0@sha256:ad4881a90fb6dff8296b248b6af6db30855c0d9147320f239e64c9ec76a188ce
            env:
              TZ: "Australia/Melbourne"
              PROVIDER: plex
              PLEX_URL: "http://plex.external.svc.cluster.local:32400"
              PROVIDER_LOCK: "true"
            envFrom:
              - secretRef:
                  name: swiparr-secret
            resources:
              requests:
                memory: 128Mi
                cpu: 50m
              limits:
                memory: 512Mi

    persistence:
      data:
        storageClass: "longhorn"
        accessMode: "ReadWriteOnce"
        size: 1Gi
        globalMounts:
          - path: /app/data

    service:
      main:
        controller: main
        ports:
          http:
            port: 4321

    ingress:
      main:
        enabled: true
        hosts:
        - host: "swiparr.${SECRET_DOMAIN}"
          paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
