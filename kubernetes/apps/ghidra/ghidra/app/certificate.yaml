---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ghidra
spec:
  secretName: ghidra-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "ghidra.${SECRET_DOMAIN}"
  dnsNames:
    - "ghidra.${SECRET_DOMAIN}"
  # Ghidra server reads a JKS keystore (-Dghidra.keystore); cert-manager writes
  # it to the secret as `keystore.jks`.
  keystores:
    jks:
      create: true
      passwordSecretRef:
        name: ghidra-keystore-password
        key: password
