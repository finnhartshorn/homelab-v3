apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-logical-backup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-logical-backup
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: dump
              image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
              command: ["sh", "/scripts/dump.sh"]
              env:
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-superuser-credentials
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-superuser-credentials
                      key: password
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: docker.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
              command: ["sh", "/scripts/upload.sh"]
              env:
                - name: MC_HOST_URL
                  value: http://192.168.1.241:9000
                - name: ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-minio-secret
                      key: ACCESS_KEY_ID
                - name: ACCESS_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-minio-secret
                      key: ACCESS_SECRET_KEY
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: backup
                  mountPath: /backup
          volumes:
            - name: scripts
              configMap:
                name: postgres-logical-backup-scripts
            - name: backup
              emptyDir: {}
