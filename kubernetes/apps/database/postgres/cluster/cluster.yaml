---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  # Applying this spec alone does NOT migrate the surviving instances onto
  # the new storageClass/nodeSelector: CNPG never recreates a running
  # instance's PVC just because storageClass/nodeSelector changed (a PVC is
  # already bound to a PV; StorageClass only matters at provisioning time -
  # see https://github.com/cloudnative-pg/cloudnative-pg/issues/7639).
  # Applying this alone only scales 3->2 (removes the highest-ordinal
  # instance, postgres-3 on node3). Moving the two survivors onto the new
  # NVMe storage/nodes then requires a manual, one-at-a-time PVC+Pod
  # delete-and-recreate per instance (replica first, promote, then old
  # primary) so each rejoins via streaming replication instead of losing
  # data.
  instances: 2

  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie

  enableSuperuserAccess: true
  superuserSecret:
    name: postgres-superuser-credentials

  storage:
    size: 50Gi
    storageClass: openebs-hostpath-nvme
    resizeInUseVolumes: false

  affinity:
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    nodeSelector:
      node-role.kubernetes.io/postgres: "true"

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi

  postgresql:
    shared_preload_libraries:
      - timescaledb
    parameters:
      timescaledb.license: "timescale"
    extensions:
      - name: timescaledb
        image:
          reference: ghcr.io/finnhartshorn/timescaledb-cnpg:2.28.3-pg18
      - name: timescaledb_toolkit
        image:
          reference: ghcr.io/finnhartshorn/timescaledb-cnpg/toolkit:1.23.0-pg18

  managed:
    roles:
      - name: quizzer
        login: true
        passwordSecret:
          name: quizzer-db-credentials
      - name: windmill
        login: true
        passwordSecret:
          name: windmill-db-credentials
      - name: windmill_admin
        login: false
      - name: windmill_user
        login: false
      - name: telegraf
        login: true
        passwordSecret:
          name: telegraf-db-credentials
      - name: grafana_ro
        login: true
        passwordSecret:
          name: grafana-ro-credentials

  backup:
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/
      endpointURL: http://192.168.1.241:9000
      s3Credentials:
        accessKeyId:
          name: cnpg-minio-secret
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-minio-secret
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"
