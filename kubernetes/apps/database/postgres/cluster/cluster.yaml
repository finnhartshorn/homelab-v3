---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 3

  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie

  enableSuperuserAccess: true
  superuserSecret:
    name: postgres-superuser-credentials

  storage:
    size: 50Gi
    storageClass: openebs-hostpath-quota

  affinity:
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi

  postgresql:
    shared_preload_libraries:
      - timescaledb
    parameters:
      timescaledb.license: "timescale"
    extensions:
      - name: timescaledb
        image:
          reference: ghcr.io/finnhartshorn/timescaledb-cnpg:2.28.3-pg18
      - name: timescaledb_toolkit
        image:
          reference: ghcr.io/finnhartshorn/timescaledb-cnpg/toolkit:1.23.0-pg18

  managed:
    roles:
      - name: quizzer
        login: true
        passwordSecret:
          name: quizzer-db-credentials
      - name: windmill
        login: true
        passwordSecret:
          name: windmill-db-credentials
      - name: windmill_admin
        login: false
      - name: windmill_user
        login: false

  backup:
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/
      endpointURL: http://192.168.1.241:9000
      s3Credentials:
        accessKeyId:
          name: cnpg-minio-secret
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-minio-secret
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"
