---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app postgres
  namespace: flux-system
  # The logical-backup script's shell variables (${db}) would otherwise
  # collide with Flux's own ${VAR} postBuild substitution. This label opts
  # this Kustomization out of the cluster-apps patch that would otherwise
  # add both postBuild.substituteFrom AND decryption together (see
  # kubernetes/flux/cluster/ks.yaml) - so decryption must be declared
  # explicitly below, since this dir has several sops-encrypted Secrets.
  labels:
    substitution.flux.home.arpa/disabled: "true"
spec:
  targetNamespace: database
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/database/postgres/cluster
  prune: true
  dependsOn:
    - name: cloudnative-pg
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: false
  interval: 30m
  timeout: 5m
