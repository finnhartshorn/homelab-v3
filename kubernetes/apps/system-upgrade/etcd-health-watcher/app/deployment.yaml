---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: etcd-health-watcher
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: etcd-health-watcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: etcd-health-watcher
    spec:
      serviceAccountName: etcd-health-watcher
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: etcd-health-watcher
          # renovate: datasource=docker depName=alpine/k8s
          image: docker.io/alpine/k8s:1.37.0
          env:
            - name: HOME
              value: /tmp
          command:
            - sh
            - -c
            - |
              set -u

              # tuppr's own healthChecks only see status.conditions on Node -
              # kubelet reports Ready again within seconds of a control-plane
              # node rebooting, well before etcd's raft group has actually
              # restabilised (leader re-election / log catch-up). That gap is
              # what let tuppr start upgrading the next node straight into an
              # etcd that was still timing out requests (seen firsthand: a
              # `kubectl logs` against the upgrade job pod returned
              # "etcdserver: request timed out" right after a control-plane
              # reboot). kube-apiserver's own /healthz/etcd, queried directly
              # per-node rather than through the load-balanced VIP, reflects
              # that far more honestly than Node readiness does - so publish
              # it as a ConfigMap tuppr's healthChecks can gate on.
              NS=system-upgrade
              CM=etcd-health
              SA_DIR=/var/run/secrets/kubernetes.io/serviceaccount
              CA="$SA_DIR/ca.crt"

              # Polled with curl/jq rather than kubectl: every kubectl call is
              # a fresh Go binary start + TLS handshake, and a 10s loop of ~6
              # of them kept this pod at ~50m CPU on a control plane that is
              # otherwise idle. curl against the same endpoints costs a
              # fraction of that.
              API=https://kubernetes.default.svc
              HEARTBEAT=60
              last_key=""
              last_write=0

              while true; do
                # Re-read the token every cycle since it's periodically rotated.
                TOKEN=$(cat "$SA_DIR/token")

                ips=$(curl -sS -m 5 --cacert "$CA" -H "Authorization: Bearer $TOKEN" "$API/api/v1/nodes" 2>/dev/null |
                  jq -r '.items[]?.status.addresses[]? | select(.type=="InternalIP") | .address' 2>/dev/null)

                if [ -z "$ips" ]; then
                  healthy=false
                  detail="could not list nodes"
                else
                  healthy=true
                  detail=""
                  # Each node's own kube-apiserver is queried directly (not
                  # the load-balanced VIP) with the same ServiceAccount
                  # identity.
                  for ip in $ips; do
                    out=$(curl -sS -m 5 --cacert "$CA" -H "Authorization: Bearer $TOKEN" "https://$ip:6443/healthz/etcd" 2>&1)
                    if [ "$out" != "ok" ]; then
                      healthy=false
                      detail="$detail $ip=$out;"
                    fi
                  done
                fi

                # Only touch the ConfigMap when the result changes, plus a
                # periodic heartbeat so checkedAt still shows the watcher is
                # alive. tuppr only gates on .data.healthy.
                now=$(date +%s)
                key="$healthy|$detail"
                if [ "$key" != "$last_key" ] || [ $((now - last_write)) -ge "$HEARTBEAT" ]; then
                  ts=$(date -u +%FT%TZ)
                  if kubectl -n "$NS" create configmap "$CM" \
                    --from-literal=healthy="$healthy" \
                    --from-literal=checkedAt="$ts" \
                    --from-literal=detail="$detail" \
                    --dry-run=client -o yaml | kubectl apply -f - >/dev/null; then
                    last_key="$key"
                    last_write=$now
                  fi
                  echo "### $ts healthy=$healthy${detail:+ detail:$detail}"
                fi
                sleep 10
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
