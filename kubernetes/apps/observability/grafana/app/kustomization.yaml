---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./grafana-admin.sops.yaml
  - ./grafana-ro-credentials.sops.yaml
configMapGenerator:
  - name: grafana-dashboard-air-quality
    files:
      - ./dashboards/air-quality.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-kubernetes-cluster
    files:
      - ./dashboards/kubernetes-cluster.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-longhorn
    files:
      - ./dashboards/longhorn.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-cnpg-postgres
    files:
      - ./dashboards/cnpg-postgres.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
