---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: telegraf
---
# Read-only access for inputs.kube_inventory (cluster object state),
# nodes/stats for inputs.kubernetes (per-node kubelet summary API, scraped
# directly against each node's kubelet rather than proxied through the
# apiserver), and pod watch for inputs.prometheus' monitor_kubernetes_pods
# (CoreDNS/Cilium/CNPG scrapes, which have no stable Service to target so
# are discovered by pod label instead).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: telegraf
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - persistentvolumes
      - persistentvolumeclaims
      - resourcequotas
      - services
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources:
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - nodes/stats
      - nodes/proxy
    verbs: ["get"]
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: telegraf
subjects:
  - kind: ServiceAccount
    name: telegraf
    namespace: observability
roleRef:
  kind: ClusterRole
  name: telegraf
  apiGroup: rbac.authorization.k8s.io
