---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: telegraf
---
# Read-only access for inputs.kube_inventory (cluster object state) and
# nodes/stats for inputs.kubernetes (per-node kubelet summary API, scraped
# directly against each node's kubelet rather than proxied through the
# apiserver).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: telegraf
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - pods
      - persistentvolumes
      - persistentvolumeclaims
      - resourcequotas
      - services
      - endpoints
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources:
      - nodes/stats
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: telegraf
subjects:
  - kind: ServiceAccount
    name: telegraf
    namespace: observability
roleRef:
  kind: ClusterRole
  name: telegraf
  apiGroup: rbac.authorization.k8s.io
