---
apiVersion: v1
kind: ConfigMap
metadata:
  name: telegraf-config
  namespace: observability
data:
  telegraf.conf: |
    [agent]
      interval = "30s"
      flush_interval = "30s"
      omit_hostname = true

    # namedrop excludes two metrics whose names exceed Postgres's 63-byte
    # identifier limit, which breaks table create/lookup permanently.
    [[inputs.prometheus]]
      urls = ["http://external-ingress-nginx-controller-metrics.network.svc.cluster.local:10254/metrics"]
      namedrop = ["nginx_ingress_controller_nginx_process_oldest_start_time_seconds", "nginx_ingress_controller_config_last_reload_successful_timestamp_seconds"]

    [[inputs.prometheus]]
      urls = ["http://internal-ingress-nginx-controller-metrics.network.svc.cluster.local:10254/metrics"]
      namedrop = ["nginx_ingress_controller_nginx_process_oldest_start_time_seconds", "nginx_ingress_controller_config_last_reload_successful_timestamp_seconds"]

    # CoreDNS, Cilium, CNPG and Longhorn have no stable Service exposing
    # per-replica metrics (CoreDNS: kube-dns Service only covers 53; Cilium:
    # cilium-agent Service only covers the Envoy port, not the agent's own
    # metrics; CNPG's -rw/-ro/-r Services only cover 5432; Longhorn's
    # longhorn-backend Service load-balances across all longhorn-manager
    # pods, so scraping it only ever captures whichever one node kube-proxy
    # routed the request to at that instant instead of all of them) -
    # discover by pod label instead, which also means every replica gets
    # scraped rather than whichever pod a Service happens to route a given
    # request to.
    [[inputs.prometheus]]
      monitor_kubernetes_pods = true
      monitor_kubernetes_pods_method = "settings"
      monitor_kubernetes_pods_namespace = "kube-system"
      monitor_kubernetes_pods_port = 9153
      kubernetes_label_selector = "k8s-app=kube-dns"

    # namedrop excludes Cilium's cilium_feature_*/cilium_operator_feature_*
    # families: static build-time feature-flag gauges (not real time-series
    # data) whose self-documenting names regularly exceed Postgres's 63-byte
    # identifier limit and break table create/lookup permanently.
    [[inputs.prometheus]]
      monitor_kubernetes_pods = true
      monitor_kubernetes_pods_method = "settings"
      monitor_kubernetes_pods_namespace = "kube-system"
      monitor_kubernetes_pods_port = 9962
      kubernetes_label_selector = "k8s-app=cilium"
      namedrop = ["cilium_feature_*"]

    [[inputs.prometheus]]
      monitor_kubernetes_pods = true
      monitor_kubernetes_pods_method = "settings"
      monitor_kubernetes_pods_namespace = "kube-system"
      monitor_kubernetes_pods_port = 9963
      kubernetes_label_selector = "io.cilium/app=operator"
      namedrop = ["cilium_operator_feature_*"]

    # namedrop excludes:
    # - blk_read_time/blk_write_time: pg_stat_database's I/O timing columns,
    #   which stay permanently 0 because track_io_timing is off on this
    #   cluster (the cost of enabling it isn't worth it, so these never
    #   carry real data).
    # - archiver/backup metrics: physical backup + WAL archiving was removed
    #   in favor of per-database logical (pg_dump) backups, which aren't
    #   CNPG-managed and so aren't exposed via these metrics. CNPG's
    #   archive_command wrapper still exits 0 with no backup destination
    #   configured, so archived_count/last_archived_time etc. would keep
    #   climbing as if archiving were succeeding - misleading, not just
    #   unused. cnpg_pg_stat_archiver_stats_reset_time is kept since it's
    #   still used by the "Version & Stats Reset Age" panel.
    [[inputs.prometheus]]
      monitor_kubernetes_pods = true
      monitor_kubernetes_pods_method = "settings"
      monitor_kubernetes_pods_namespace = "database"
      monitor_kubernetes_pods_port = 9187
      kubernetes_label_selector = "cnpg.io/cluster=postgres"
      namedrop = ["cnpg_pg_stat_database_blk_read_time", "cnpg_pg_stat_database_blk_write_time", "cnpg_pg_stat_archiver_archived_count", "cnpg_pg_stat_archiver_failed_count", "cnpg_pg_stat_archiver_last_archived_time", "cnpg_pg_stat_archiver_last_failed_time", "cnpg_pg_stat_archiver_seconds_since_last_archival", "cnpg_pg_stat_archiver_seconds_since_last_failure", "cnpg_collector_pg_wal_archive_status", "cnpg_collector_first_recoverability_point", "cnpg_collector_last_available_backup_timestamp", "cnpg_collector_last_failed_backup_timestamp"]

    [[inputs.prometheus]]
      monitor_kubernetes_pods = true
      monitor_kubernetes_pods_method = "settings"
      monitor_kubernetes_pods_namespace = "longhorn-system"
      monitor_kubernetes_pods_port = 9500
      kubernetes_label_selector = "app=longhorn-manager"

    [[inputs.kube_inventory]]
      url = "https://kubernetes.default.svc"
      bearer_token = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_ca = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      # excludes the certificate collector, which requires cluster-wide read
      # access to Secrets to scan TLS cert expiry - too broad a grant for
      # what this input is here for.
      resource_exclude = ["secrets"]

    # kubelet summary API, scraped per-node directly (not proxied through the
    # apiserver) since each kubelet only reports stats for its own node.
    # node1
    [[inputs.kubernetes]]
      url = "https://192.168.1.202:10250"
      bearer_token = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      insecure_skip_verify = true

    # node2
    [[inputs.kubernetes]]
      url = "https://192.168.1.204:10250"
      bearer_token = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      insecure_skip_verify = true

    # node3
    [[inputs.kubernetes]]
      url = "https://192.168.1.201:10250"
      bearer_token = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      insecure_skip_verify = true

    # CPU-throttling counters (nr_periods/nr_throttled/throttled_usec from
    # cgroup cpu.stat, the same numbers used manually via `kubectl exec ...
    # cat /sys/fs/cgroup/cpu.stat` to diagnose telegraf's own throttling on
    # 2026-08-06) aren't in the kubelet summary API above, only cAdvisor's
    # /metrics/cadvisor endpoint - a full dump of every cgroup metric for
    # every container on the node (~2.5MB/scrape). namepass keeps just the
    # 3 counters we want instead of the ~1000 other series in there, but
    # namepass filters after parsing, so the full payload still gets
    # downloaded and parsed every time - a 120s interval (vs. the 30s
    # default) keeps that repeated parse from becoming a throttling source
    # itself. tagexclude drops "id"/"name", which are just the same
    # container ID as an extra tag with no analytical value here.
    # node1
    [[inputs.prometheus]]
      interval = "120s"
      urls = ["https://192.168.1.202:10250/metrics/cadvisor"]
      bearer_token = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      insecure_skip_verify = true
      namepass = ["container_cpu_cfs_periods_total", "container_cpu_cfs_throttled_periods_total", "container_cpu_cfs_throttled_seconds_total"]
      tagexclude = ["id", "name"]
      [inputs.prometheus.tags]
        node = "node1"

    # node2
    [[inputs.prometheus]]
      interval = "120s"
      urls = ["https://192.168.1.204:10250/metrics/cadvisor"]
      bearer_token = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      insecure_skip_verify = true
      namepass = ["container_cpu_cfs_periods_total", "container_cpu_cfs_throttled_periods_total", "container_cpu_cfs_throttled_seconds_total"]
      tagexclude = ["id", "name"]
      [inputs.prometheus.tags]
        node = "node2"

    # node3
    [[inputs.prometheus]]
      interval = "120s"
      urls = ["https://192.168.1.201:10250/metrics/cadvisor"]
      bearer_token = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      insecure_skip_verify = true
      namepass = ["container_cpu_cfs_periods_total", "container_cpu_cfs_throttled_periods_total", "container_cpu_cfs_throttled_seconds_total"]
      tagexclude = ["id", "name"]
      [inputs.prometheus.tags]
        node = "node3"

    [[inputs.influxdb_v2_listener]]
      service_address = ":8186"
      token = "$${TELEGRAF_LISTENER_TOKEN}"

    [[outputs.postgresql]]
      connection = "host=postgres-rw.database.svc.cluster.local port=5432 user=telegraf password=$${TELEGRAF_DB_PASSWORD} dbname=telegraf sslmode=require"
      tags_as_foreign_keys = false
