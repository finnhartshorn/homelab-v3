---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: telegraf
  namespace: observability
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        containers:
          app:
            image:
              repository: docker.io/library/telegraf
              tag: "1.39"
            envFrom:
              - secretRef:
                  name: influxdb-auth
            env:
              TELEGRAF_DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: telegraf-db-credentials
                    key: password
              TELEGRAF_LISTENER_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: telegraf-listener-auth
                    key: TELEGRAF_LISTENER_TOKEN
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 256Mi
    service:
      main:
        controller: main
        ports:
          influxv2:
            port: 8186
    ingress:
      main:
        enabled: true
        hosts:
          - host: "telegraf.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: influxv2
    persistence:
      config:
        type: configMap
        name: telegraf-config
        globalMounts:
          - path: /etc/telegraf/telegraf.conf
            subPath: telegraf.conf
            readOnly: true
