apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trmnl
  namespace: trmnl
spec:
  ingressClassName: internal
  rules:
    - host: trmnl.${SECRET_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trmnl
                port:
                  name: http
